services:
  - type: web
    name: simdinkes
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: true
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        sync: true
      - key: DB_USERNAME
        sync: true
      - key: DB_PASSWORD
        sync: true
